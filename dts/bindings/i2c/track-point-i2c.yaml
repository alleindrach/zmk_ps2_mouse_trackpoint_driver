description: I2C Trackpoint

compatible: "zmk,input-track-point-i2c"

include: base.yaml

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: GPIO to which the INT pin is connected.
  reg:
    type: array
    required: true
    description: I2C address in 7 bit format.
